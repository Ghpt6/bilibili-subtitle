[project]
name = "bilibili-subtitle"
version = "0.1.0"
description = "MCP server for extracting Bilibili video subtitles/transcripts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
bilibili-subtitle = "bilibili_subtitle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilibili_subtitle"]
